name: Import BTY image library

on:
  push:
    branches:
      - image-library-pass
    paths:
      - .github/workflows/import-bty-image-library.yml

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: image-library-pass
          token: ${{ secrets.GPTFULL || github.token }}

      - name: Import and normalize image assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow requests

          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import requests
          import shutil

          ROOT = Path('.')
          ASSETS = ROOT / 'src' / 'assets'
          SOURCE = ASSETS / 'source'
          OG = ROOT / 'public' / 'og'
          SOURCE.mkdir(parents=True, exist_ok=True)
          OG.mkdir(parents=True, exist_ok=True)

          def cover(im, size):
              im = ImageOps.exif_transpose(im.convert('RGB'))
              aspect = size[0] / size[1]
              w, h = im.size
              cur = w / h
              if cur > aspect:
                  nw = int(h * aspect)
                  left = (w - nw) // 2
                  im = im.crop((left, 0, left + nw, h))
              elif cur < aspect:
                  nh = int(w / aspect)
                  top = (h - nh) // 2
                  im = im.crop((0, top, w, top + nh))
              return im.resize(size, Image.LANCZOS)

          def save_webp_from_image(im, dest, size=(900, 650), quality=62):
              dest = Path(dest)
              dest.parent.mkdir(parents=True, exist_ok=True)
              cover(im, size).save(dest, 'WEBP', quality=quality, method=6)

          def save_jpg_from_image(im, dest, size=(1200, 630), quality=78):
              dest = Path(dest)
              dest.parent.mkdir(parents=True, exist_ok=True)
              cover(im, size).save(dest, 'JPEG', quality=quality, optimize=True, progressive=True)

          def read_image(path):
              path = Path(path)
              if not path.exists():
                  return None
              try:
                  return Image.open(path)
              except Exception:
                  return None

          def convert_existing(src, dest, size=(900, 650), quality=62):
              im = read_image(src)
              if im is not None:
                  save_webp_from_image(im, dest, size, quality)
                  return True
              return False

          def download_wix(filename):
              url = f'https://static.wixstatic.com/media/{filename}'
              r = requests.get(url, timeout=30)
              r.raise_for_status()
              return Image.open(__import__('io').BytesIO(r.content))

          # Convert currently used source PNGs to webp so route imports can move off PNG files.
          convert_existing(SOURCE / 'hero-storefront-open.png', SOURCE / 'hero-storefront-open.webp', (1200, 900), 70)
          convert_existing(SOURCE / 'contact-hero-welcome.png', SOURCE / 'contact-hero-welcome.webp', (1200, 900), 70)
          convert_existing(SOURCE / 'delivery-hero-truck.png', SOURCE / 'delivery-hero-truck.webp', (1200, 900), 70)

          # Maintain companion images used by routes and OG generation.
          for src_name, dest_name in [
              ('hero-storefront-open.webp', 'hero-desktop-yard.webp'),
              ('contact-hero-welcome.webp', 'yard-banner-5.webp'),
              ('delivery-hero-truck.webp', 'loading-truck.webp'),
              ('delivery-hero-truck.webp', 'yard-trucks.webp'),
          ]:
              src = SOURCE / src_name
              dest = SOURCE / dest_name
              if src.exists():
                  shutil.copyfile(src, dest)

          if (SOURCE / 'hero-storefront-open.webp').exists():
              shutil.copyfile(SOURCE / 'hero-storefront-open.webp', ASSETS / 'hero-storefront-desktop.webp')
              shutil.copyfile(SOURCE / 'hero-storefront-open.webp', ASSETS / 'hero-storefront-mobile.webp')
          if (SOURCE / 'yard-piles.webp').exists():
              shutil.copyfile(SOURCE / 'yard-piles.webp', ASSETS / 'featured-hero-yard.webp')

          # Product and garden images from the supplied BTY/Wix image filenames.
          product_sources = {
              'mulch-black.webp': '7a19d6_930ccddf992944d48eb0375cf21217cf~mv2.jpg',
              'mulch-hemlock.webp': '7a19d6_80324c70c2844478861da69e0c9cdc35~mv2.jpg',
              'mulch-pine.webp': '7a19d6_b4999128f27e4e71bc094b8f81043c07~mv2.jpg',
              'loam.webp': '7a19d6_f294d31f3f1044d790614406a464dc57~mv2.jpg',
              'sand.webp': '7a19d6_b49b5efa9fe0463d9913a59eea480c40~mv2.jpg',
              'stone-blue-crushed.webp': '7a19d6_b9996354b5a74522ba4ac48b1479a994~mv2.jpg',
              'stone-pea-new.webp': '7a19d6_2047300295e94188b52218857720aea3~mv2.jpg',
              'stone-river.webp': '7a19d6_1db7c6210b2d444fb80075485458a332~mv2.jpg',
              'stone-lava.webp': '7a19d6_38401efc37b94fe6b8b8309c0a5470af~mv2.jpg',
              'playground-chips.webp': '7a19d6_80324c70c2844478861da69e0c9cdc35~mv2.jpg',
              'winter-salt.webp': '7a19d6_f32c531cb8c74cad806545b09e3f53ab~mv2.jpg',
              'tools-handheld.webp': '7a19d6_659ad83ad41647fd86cd6af6576e4563~mv2.jpg',
              'tools-counter.webp': '7a19d6_659ad83ad41647fd86cd6af6576e4563~mv2.jpg',
          }
          for dest, filename in product_sources.items():
              try:
                  im = download_wix(filename)
                  save_webp_from_image(im, ASSETS / dest, (900, 900), 68)
                  print('downloaded', dest)
              except Exception as exc:
                  print('WARN product image fallback', dest, exc)

          # Logo/public mark from the supplied BTY logo filename when available.
          try:
              im = download_wix('D3B98FF8-34CE-485C-8479-D1F7A011C7BE.PNG')
              save_webp_from_image(im, ASSETS / 'brandmark-dark.webp', (700, 700), 72)
              save_webp_from_image(im, ROOT / 'public' / 'brandmark.webp', (700, 700), 72)
          except Exception as exc:
              print('WARN logo fallback', exc)

          # Garden center/fb images: reuse existing optimized files if public URL names are not available.
          # These will be replaced by the next hand-placed binary upload pass if needed.

          # Update imports away from deleted PNG source files.
          replacements = {
              'src/routes/index.tsx': [
                  ('@/assets/source/hero-storefront-open.png', '@/assets/source/hero-storefront-open.webp'),
              ],
              'src/routes/contact.tsx': [
                  ('@/assets/source/contact-hero-welcome.png', '@/assets/source/contact-hero-welcome.webp'),
              ],
              'src/routes/delivery.tsx': [
                  ('@/assets/source/delivery-hero-truck.png', '@/assets/source/delivery-hero-truck.webp'),
              ],
              'scripts/og.mjs': [
                  ('src/assets/brandmark-dark.png', 'src/assets/brandmark-dark.webp'),
                  ('src/assets/source/hero-desktop-yard.png', 'src/assets/source/hero-desktop-yard.webp'),
              ],
          }
          for file, reps in replacements.items():
              path = Path(file)
              if not path.exists():
                  continue
              text = path.read_text()
              for old, new in reps:
                  text = text.replace(old, new)
              path.write_text(text)

          # Remove legacy image/video sources that should not survive this purge pass.
          for pattern in ['*.png', '*.jpg', '*.jpeg']:
              for f in SOURCE.glob(pattern):
                  if f.name != 'wbe-seal.webp':
                      f.unlink(missing_ok=True)
          if (ASSETS / 'video').exists():
              shutil.rmtree(ASSETS / 'video')

          # Regenerate social cards from the normalized image set.
          og_jobs = [
              (SOURCE / 'hero-desktop-yard.webp', OG / 'og-home.jpg'),
              (SOURCE / 'abby-portrait.webp', OG / 'og-about.jpg'),
              (SOURCE / 'yard-piles.webp', OG / 'og-products.jpg'),
              (SOURCE / 'loading-truck.webp', OG / 'og-delivery.jpg'),
              (SOURCE / 'yard-banner-5.webp', OG / 'og-contact.jpg'),
              (SOURCE / 'yard-trucks.webp', OG / 'og-quote.jpg'),
          ]
          for src, dest in og_jobs:
              im = read_image(src)
              if im is not None:
                  save_jpg_from_image(im, dest)

          (ASSETS / 'PHOTO_CREDITS.md').write_text(
              '# Photo credits\n\nReplacement image pass run from the supplied Buy The Yard image library and public BTY/Wix media filenames. Legacy PNG/JPEG source files and old hero video files were removed from the repository.\n'
          )
          PY

      - name: Commit normalized image library
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-bty-image-library.yml
          git config user.name "bty-image-importer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          if git diff --cached --name-only | grep -E '^\.env($|\.)'; then
            echo "Refusing to commit .env changes" >&2
            exit 1
          fi
          if grep -RInE '@/assets/source/.*\.(png|jpe?g)' src --include='*.ts' --include='*.tsx'; then
            echo "Found stale source PNG/JPEG imports" >&2
            exit 1
          fi
          git commit -m "Import replacement BTY image library"
          git push origin HEAD:image-library-pass
